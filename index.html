
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 마당에 운석이 떨어졌다!</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#050816;
color:white;
}

header{
padding:120px 40px;
background:linear-gradient(180deg,#081426,#050816);
text-align:center;
}

h1{
font-size:72px;
margin-bottom:20px;
}

.hero-text{
max-width:900px;
margin:auto;
font-size:22px;
color:#c6d3e0;
}

.section{
max-width:1200px;
margin:auto;
padding:100px 20px;
}

.section h2{
font-size:48px;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

.card{
background:#10182f;
padding:30px;
border-radius:24px;
}

.preview{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
gap:30px;
}

.preview img{
width:100%;
border-radius:24px;
}

.button{
display:inline-block;
padding:18px 34px;
background:#00aaff;
color:white;
text-decoration:none;
border-radius:14px;
font-weight:bold;
margin-top:30px;
}

footer{
padding:40px;
text-align:center;
color:#7e8a99;
}
</style>
</head>

<body>

<header>
<h1>☄️ 내 마당에 운석이 떨어졌다!</h1>

<p class="hero-text">
곡괭이 하나로 시작해 드론과 레이저 자동화 시스템을 구축하고,
거대한 운석을 파괴해 마당을 되찾아라.
</p>

<a class="button" href="https://drive.google.com/file/d/1UeHlRFfuSue5lX6MThrEUnkoWuP3LBaX/view?usp=drive_link" target="_blank">
게임 다운로드
</a>
</header>

<section class="section">
<h2>핵심 게임 루프</h2>

<div class="cards">
<div class="card">
<h3>☄️ 운석 타격</h3>
<p>곡괭이로 운석을 타격해 별 파편을 획득한다.</p>
</div>

<div class="card">
<h3>📈 업그레이드</h3>
<p>클릭 효율과 생산량을 강화한다.</p>
</div>

<div class="card">
<h3>🤖 자동화 구축</h3>
<p>드론과 레이저로 생산 시스템을 자동화한다.</p>
</div>
</div>
</section>

<section class="section">
<h2>플레이 미리보기</h2>

<div class="preview">

<div>
<img src="meteor_gameplay.png">
<h3>운석 채굴 액션</h3>
</div>

<div>
<img src="upgrade_ui.png">
<h3>업그레이드 UI</h3>
</div>

</div>
</section>

<footer>
© 2026 Meteor In My Yard
</footer>

</body>
</html>
